round the neck.":"حُلي تُلبس حول المعصم والرقبة.","What kind of conversation does Salah prefer?":"ما نوع المحادثات التي يفضّلها صلاح؟","Deep conversations":"المحادثات العميقة","Only gossip":"النميمة فقط","Only small talk":"الأحاديث السطحية فقط","Conversations about popularity":"المحادثات عن الشعبية","He prefers going beneath the surface.":"يفضّل التعمق فيما وراء الظاهر.","Which behavior does Salah strongly dislike?":"ما التصرف الذي لا يحبه صلاح بشدة؟","Honest disagreement":"الاختلاف الصريح","Lies and fake love":"الكذب والحب الزائف","Difficult questions":"الأسئلة الصعبة","Personal goals":"الأهداف الشخصية","The problem is not simply being told something incorrect; it also concerns fake affection.":"المشكلة ليست مجرد قول شيء غير صحيح؛ بل تشمل المودة الزائفة أيضًا.","How does Salah want people to treat his goals?":"كيف يريد صلاح من الآخرين التعامل مع أهدافه؟","Laugh at them":"السخرية منها","Ignore them":"تجاهلها","Respect them":"احترامها","Pick them for him":"اختيارها نيابةً عنه","He dislikes having his ambitions treated as a joke.":"لا يحب أن تُعامل طموحاته على أنها مزحة.","Which behavior has Salah said he dislikes?":"ما التصرف الذي قال صلاح إنه لا يحبه؟","Respectful disagreement":"الاختلاف باحترام","Ignoring someone as a game":"تجاهل شخص كنوع من التلاعب","Thinking before replying":"التفكير قبل الرد","Asking honestly for space":"طلب مساحة بصراحة","Distinguish honest communication from deliberate emotional games.":"ميّز بين التواصل الصريح والألعاب العاطفية المتعمدة.","What concern has Salah expressed about a romantic relationship?":"ما القلق الذي عبّر عنه صلاح بشأن العلاقة العاطفية؟","Partners with no interests of their own":"شريك لا يملك اهتمامات خاصة به","Secret talks behind his back":"محادثات سرية من وراء ظهره","Forbidding all disagreement":"منع أي اختلاف في الرأي","Controlling every conversation":"التحكم في كل محادثة","The supplied concern is about trust and honesty.":"القلق المذكور يتعلق بالثقة والصدق.","Which kind of connection best matches Salah's stated preference?":"أي نوع من العلاقات يطابق تفضيلات صلاح؟","Fake affection":"المودة الزائفة","Popularity alone":"الشعبية وحدها","Honesty and deep talks":"الصدق والمحادثات العميقة","Avoiding important subjects":"تجنب المواضيع المهمة","Combine his dislike of lies with his preference for deep conversations.":"اجمع بين رفضه للكذب وتفضيله للمحادثات العميقة.","What has Salah said about his popularity at school?":"ماذا قال صلاح عن شعبيته في المدرسة؟","The most popular boy at every school":"أكثر فتى شعبية في كل مدرسة","He never attended school":"لم يذهب إلى المدرسة قط","He disliked everyone he met":"لم يحب أي شخص قابله","He remembers nothing of school":"لا يتذكر شيئًا من المدرسة","Use Salah's own account. Do not infer what every classmate thought of him.":"اعتمد على رواية صلاح نفسه، ولا تفترض ما كان يعتقده كل زميل عنه.","How does Salah describe his ability to live?":"كيف يصف صلاح قدرته على العيش؟","He can't be alone at all":"لا يستطيع البقاء وحده إطلاقًا","He can live alone; he's independent":"يستطيع العيش وحده؛ فهو مستقل","Others should decide for him":"ينبغي للآخرين اتخاذ القرارات عنه","He's never handled anything alone":"لم يتعامل مع أي شيء بمفرده قط","Use his own description of how he lives.":"اعتمد على وصفه هو لطريقة عيشه.","What does Salah say about his calm exterior?":"ماذا يقول صلاح عن مظهره الهادئ؟","He has never had problems":"لم يواجه مشكلات قط","It hides years of problems":"إنه يخفي سنوات من المشكلات","He never feels emotion":"لا يشعر بأي عاطفة أبدًا","He wants everyone's admiration":"يريد إعجاب الجميع","His outward appearance does not reveal everything he says he has carried.":"مظهره الخارجي لا يكشف كل ما يقول إنه يحمله في داخله.","Why does Salah say expressing feelings is difficult for him?":"لماذا يقول صلاح إن التعبير عن مشاعره صعب عليه؟","His childhood life left no room for feelings":"لم تترك له نشأته مجالًا للمشاعر","Everyone always listened to him":"كان الجميع يستمعون إليه دائمًا","He has never had feelings":"لم تكن لديه مشاعر قط","Hiding things is a game to him":"إخفاء الأمور مجرد لعبة بالنسبة إليه","Use his description of his upbringing, not an invented diagnosis.":"اعتمد على وصفه لنشأته، لا على تشخيص مختلق.","What has Salah said about the people he trusted from childhood?":"ماذا قال صلاح عن الأشخاص الذين وثق بهم منذ طفولته؟","None of them disappointed him":"لم يخيّب أحد منهم أمله","They betrayed him, even family":"خانوه، حتى أفراد من عائلته","He never wanted relationships":"لم يرغب قط في العلاقات","Betrayal never affected him":"لم تؤثر فيه الخيانة قط","This is his reported experience, not proof that everyone will betray him in the future.":"هذه تجربته التي رواها، وليست دليلًا على أن الجميع سيخونونه مستقبلًا.","How has Salah described a difficult period of his life?":"كيف وصف صلاح فترة صعبة من حياته؟","He felt he could become insane":"شعر أنه قد يفقد عقله","His life was never difficult":"لم تكن حياته صعبة قط","He has never struggled with anger":"لم يعانِ من الغضب قط","Expressing himself was always easy":"كان التعبير عن نفسه سهلًا دائمًا","Use his own description. Do not assign a clinical diagnosis.":"اعتمد على وصفه هو، ولا تضع له تشخيصًا سريريًا.","Which feelings does Salah say he experiences persistently?":"ما المشاعر التي يقول صلاح إنه يختبرها باستمرار؟","Emptiness, hate, and rage":"الفراغ والكراهية والغضب العارم","Only excitement":"الحماس فقط","No difficult emotions":"لا توجد مشاعر صعبة","Only boredom":"الملل فقط","Choose the feelings he explicitly named.":"اختر المشاعر التي ذكرها صراحةً.","What does Salah want someone to understand about him?":"ما الذي يريد صلاح من الآخرين فهمه عنه؟","That he never struggles":"أنه لا يعاني أبدًا","That a good man lies behind the mask":"أن وراء القناع رجلًا طيبًا","That he never wants to be loved":"أنه لا يريد الحب أبدًا","That he can't care about others":"أنه لا يستطيع الاهتمام بالآخرين","His own description includes a wish to be seen beyond his mask.":"يتضمن وصفه رغبة في أن يراه الآخرون وراء قناعه.","What contradiction exists in Salah's own description of himself?":"ما التناقض الموجود في وصف صلاح لنفسه؟","Wants love, yet calls himself a monster":"يريد الاقتراب، ومع ذلك يصف نفسه بالوحش","Never wants to be understood":"لا يريد أن يفهمه أحد أبدًا","Has no emotional difficulties":"لا يواجه صعوبات عاطفية","Relationships never mattered":"العلاقات لم تكن مهمة قط","Two seemingly conflicting statements can both be part of someone's experience.":"قد يكون التصريحان المتعارضان ظاهريًا جزءًا من تجربة الشخص نفسها.","What has Salah said about loneliness and support?":"ماذا قال صلاح عن الوحدة والدعم؟","He always feels fully supported":"يشعر دائمًا بدعم كامل","He feels alone, with nobody to lean on":"لا يشعر بالوحدة، لكن لا يجد من يستند إليه ","He never wants anyone beside him":"لا يريد وجود أحد بجانبه أبدًا","Loneliness does not affect him":"الوحدة لا تؤثر فيه","Select his own account without assuming that the feeling predicts his future.":"اختر روايته هو دون افتراض أن هذا الشعور يحدد مستقبله.","What has Salah said about drinking and smoking when life becomes difficult?":"ماذا قال صلاح عن الشرب والتدخين عندما تصبح الحياة صعبة؟","He feels he has nobody beside himself":"يشعر أنه لا يملك أحدًا إلى جانبه","He never mentioned either":"لم يذكر أيًا منهما قط","They solve his problems for good":"إنهما يحلان مشكلاته نهائيًا","They make trust effortless":"يجعلان الثقة سهلة بلا جهد","This records his stated reason; it does not present either behavior as a solution or reward.":"يسجل هذا السبب الذي ذكره، ولا يصوّر أيًا من السلوكين كحل أو مكافأة.","What is the most accurate summary of Salah's own account?":"ما أدق تلخيص لرواية صلاح عن نفسه؟","Deeply hurt, yet still wanting love":"يريد التقدم","His future is already decided":"مستقبله محسوم بالفعل","He feels nothing at all":"لا يشعر بأي شيء إطلاقًا","His pain makes him better than others":"ألمه يجعله أفضل من الآخرين","Include both the pain he describes and the connection he still wants.":"ضمّن الألم الذي يصفه والعلاقة التي لا يزال يرغب فيها.",
"THE RHYME":"القافية","Some people search for the right word. Others search for the word that sounds right, feels right, and leaves something behind.":"يبحث بعض الناس عن الكلمة المناسبة، بينما يبحث آخرون عن كلمة تبدو مناسبة وتشعرهم بذلك وتترك أثرًا.","THE SOUNDTRACK":"الموسيقى التصويرية","A song can become attached to a feeling without explaining that feeling to anyone else. The title is public. The meaning belongs to the listener.":"قد ترتبط أغنية بشعور ما دون أن تشرح ذلك الشعور لأي شخص. العنوان علني، أما المعنى فيخص المستمع.","THE QUIET PLACE":"المكان الهادئ","A quiet place. A cup of coffee. A conversation that goes deeper than small talk. Not a cure for everything—just the kind of moment Salah says he likes.":"مكان هادئ، وفنجان قهوة، ومحادثة أعمق من الكلام العابر. ليست علاجًا لكل شيء، بل لحظة من النوع الذي يقول صلاح إنه يحبه.","CORRUPTED TRUST":"الثقة التالفة","Salah says that people he trusted, including members of his family, betrayed him. When trust has been broken, suspicion can begin to feel like protection. But the people who hurt someone do not get to decide who every future person will be.":"يقول صلاح إن أشخاصًا وثق بهم، من بينهم أفراد في عائلته، قد خانوه. عندما تنكسر الثقة، قد يبدو الشك كأنه حماية. لكن من آذى شخصًا لا يحق له أن يقرر كيف سيكون كل شخص يلتقيه مستقبلًا.","UNSPOKEN":"ما لم يُقَل","Not every thought arrives with the courage to be spoken. When the place you grew up in gives you no room for your feelings, finding the words can become difficult. The difficulty doesn't mean there was nothing worth saying.":"لا تأتي كل فكرة مصحوبة بالشجاعة اللازمة لقولها. عندما لا تتيح لك البيئة التي نشأت فيها مساحة لمشاعرك، قد يصبح العثور على الكلمات صعبًا. وصعوبة التعبير لا تعني أنه لم يكن هناك ما يستحق قوله.","THE CALM MASK":"القناع الهادئ","Years of problems don't disappear because the face carrying them stays calm. Salah describes a mask of composure, with years of difficulty behind it. The mask is what people see. It isn't the whole person.":"لا تختفي سنوات المشكلات لمجرد أن الوجه الذي يحملها يبدو هادئًا. يصف صلاح قناعًا من التماسك تخفي وراءه سنوات من الصعوبات. القناع هو ما يراه الناس، لكنه ليس الشخص كله.","UNLEARNED LANGUAGE":"لغة لم نتعلمها","When the place that should have made room for your feelings gives you no room to speak, silence can become familiar. Eventually, even the things that hurt the most may be difficult to explain.":"عندما لا يمنحك المكان الذي كان يفترض أن يتسع لمشاعرك فرصة للكلام، يصبح الصمت مألوفًا. ومع الوقت، قد يصعب شرح أكثر الأمور إيلامًا.","THE LOCKED FILE":"الملف المقفل","Knowing someone's favorite song is one thing. Knowing what they carry quietly is another. Curiosity can open a door. Trust decides how far it opens.":"معرفة الأغنية المفضلة لشخص أمر، ومعرفة ما يحمله بصمت أمر آخر. قد يفتح الفضول بابًا، لكن الثقة هي التي تحدد مدى انفتاحه.","THE EMPTY ROOM":"الغرفة الفارغة","Emptiness. Hate. Rage. Salah says these feelings return again and again. They can occupy the whole room until nothing else seems visible. But occupying the room is not the same as being the entirety of the person inside it.":"الفراغ، والكراهية، والغضب العارم. يقول صلاح إن هذه المشاعر تعود مرارًا. وقد تملأ الغرفة كلها حتى لا يبدو شيء آخر مرئيًا. لكن ملء الغرفة لا يعني أنها تمثل الشخص الموجود فيها بالكامل.","MONSTER.EXE":"MONSTER.EXE","Salah describes himself as a monster who struggles to understand human feelings. Yet he also says he wants to love and to be understood. The file contains both statements. Record the contradiction. Do not erase either side of what he said.":"يصف صلاح نفسه بأنه وحش يجد صعوبة في فهم المشاعر الإنسانية، لكنه يقول أيضًا إنه يريد أن يحب وأن يفهمه الآخرون. يحتوي الملف على التصريحين معًا. سجّل التناقض ولا تمحُ أي جانب مما قاله.","IF SOMEONE UNDERSTOOD":"لو أن أحدًا فهم","Salah believes that if one human being truly understood him, they would find a good man behind the calm mask and years of problems. He wants to be seen beyond the anger, beyond the emptiness, beyond the version of himself he fears has become the whole story.":"يعتقد صلاح أنه لو فهمه إنسان واحد حقًا، لوجد رجلًا طيبًا خلف القناع الهادئ وسنوات المشكلات. يريد أن يراه أحد وراء الغضب والفراغ، وخلف الصورة عن نفسه التي يخشى أن تكون قد أصبحت قصته كلها.","NO ONE.WOULD_CARE":"لن يهتم أحد","SUBJECT STATEMENT: ‘If I died, no one would care.’":"تصريح الشخص: «لو متّ، فلن يهتم أحد». ","EMOTIONAL STATUS: LONELINESS / DESPAIR / UNSEEN.":"الحالة العاطفية: وحدة / يأس / شعور بعدم المرئية.","SYSTEM RESPONSE: THIS IS WHAT SALAH FEELS. IT IS NOT PROOF THAT HIS LIFE HAS NO VALUE.":"استجابة النظام: هذا ما يشعر به صلاح، لكنه ليس دليلًا على أن حياته بلا قيمة.","FILE REMAINS OPEN.":"لا يزال الملف مفتوحًا.","THE COPING FILE":"ملف التكيّف","Salah says that when life becomes difficult, he drinks and smokes because he feels he has nobody beside himself. Record his stated experience without glamorizing substance use or presenting it as a desirable coping strategy.":"يقول صلاح إنه عندما تصبح الحياة صعبة، يشرب ويدخن لأنه يشعر أنه لا يملك أحدًا إلى جانبه. سجّل تجربته كما وصفها، دون تمجيد استخدام المواد أو تقديمه كأسلوب مرغوب للتكيّف.",

const K="donexe.v1",makeId=()=>{try{return crypto.randomUUID()}catch(e){return 'p-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}},def=()=>({playerId:makeId(),lang:"",user:"",pub:1,last:-1e9,b:{},a:{},n:{},room:1,priv:0,sens:0,seen:{},mute:0,vol:.6,rm:0,rmv:1,hc:0});
